[project]
name = "palette-optimizer"
version = "0.1.0"
description = "Recommend the minimum set of hobby paints (Citadel / Vallejo) to reproduce a target color palette via blending."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "colour-science>=0.4.4",
    "pulp>=2.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "beautifulsoup4>=4.12",
]

[project.scripts]
palette-optimizer = "palette_optimizer.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/palette_optimizer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
